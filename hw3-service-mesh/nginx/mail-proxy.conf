server {
    listen 9080;

    location / {
        proxy_pass https://notes-proxy:8443;

        proxy_ssl_certificate         /etc/mesh/certs/mail.crt;
        proxy_ssl_certificate_key     /etc/mesh/certs/mail.key;
        proxy_ssl_trusted_certificate /etc/mesh/certs/ca.crt;
        proxy_ssl_verify              on;
        proxy_ssl_server_name         on;
        proxy_ssl_name                notes-proxy;
    }
}
