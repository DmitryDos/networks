syntax = "proto3";
package notes;

message Empty {}
message NoteId { string id = 1; }
message NoteInput { string title = 1; string content = 2; }
message NoteUpdate { string id = 1; string title = 2; string content = 3; string ifMatch = 4; }

message Note {
    string id = 1;
    string title = 2;
    string content = 3;
    int32 version = 4;
    string createdAt = 5;
    string updatedAt = 6;
}

message NoteList { repeated Note notes = 1; }

service NoteService {
    rpc List (Empty) returns (NoteList);
    rpc Get (NoteId) returns (Note);
    rpc Create (NoteInput) returns (Note);
    rpc Update (NoteUpdate) returns (Note);
    rpc Delete (NoteId) returns (Empty);
}
